name: Build Stealth Firewall EXE

# 触发条件：当你手动点击或者修改代码时运行
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    # 直接调用 GitHub 的纯净 Windows 10/11 虚拟机
    runs-on: windows-latest

    steps:
    - name: 获取源码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # 推荐使用 3.10，兼容性最好

    - name: 安装依赖 (Flask, PyInstaller)
      run: |
        python -m pip install --upgrade pip
        pip install Flask pyinstaller

    - name: 自动安装 UPX 压缩利器
      uses: crazy-max/ghaction-upx@v3
      with:
        install-only: true

    - name: 开始使用 PyInstaller 编译
      run: |
        # -F 单文件, -w 隐藏黑框, --name 伪装名称
        pyinstaller -F -w --name "WinUpdateSvc" app.py

    - name: 上传成品 EXE 供你下载
      uses: actions/upload-artifact@v4
      with:
        name: Firewall-Stealth-EXE
        path: dist/WinUpdateSvc.exe
