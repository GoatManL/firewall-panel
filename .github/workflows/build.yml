name: Build Stealth Firewall EXE

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 获取源码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pillow

    - name: 确保图标存在
      run: |
        if (-Not (Test-Path "assets/icon.ico")) {
          python make_icon.py
        } else {
          Write-Host "Using existing assets/icon.ico"
        }

    - name: 安装 UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        install-only: true

    - name: 编译正式版（无窗口，静默运行）
      run: |
        pyinstaller -F -w --uac-admin `
          --name "WinUpdateSvc" `
          --icon=assets/icon.ico `
          --upx-dir "C:\ProgramData\chocolatey\bin" `
          app.py

    - name: 编译调试版（有窗口，看报错）
      run: |
        pyinstaller -F --uac-admin `
          --name "WinUpdateSvc_Debug" `
          --icon=assets/icon.ico `
          --upx-dir "C:\ProgramData\chocolatey\bin" `
          app.py

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: WinUpdateSvc-${{ github.run_number }}
        path: |
          dist/WinUpdateSvc.exe
          dist/WinUpdateSvc_Debug.exe

    - name: 创建 Release（仅 tag 触发）
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/WinUpdateSvc.exe
          dist/WinUpdateSvc_Debug.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
