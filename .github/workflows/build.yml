name: Build Stealth Firewall EXE

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 获取源码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pillow

    - name: 确保图标存在
      run: |
        if (-Not (Test-Path "assets/icon.ico")) {
          python -c "
          from PIL import Image, ImageDraw
          size = 256
          img = Image.new('RGBA', (size, size), (0,0,0,0))
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle([10, 10, size-10, size-10], radius=40, fill=(120, 120, 120, 255))
          draw.text((size//2, size//2), 'W', fill=(255,255,255,255), anchor='mm')
          import os; os.makedirs('assets', exist_ok=True)
          img.save('assets/icon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(256,256)])
          "
        }

    - name: 安装 UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        install-only: true

    - name: 使用 PyInstaller 编译（Spec 模式）
      run: pyinstaller WinUpdateSvc.spec

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: WinUpdateSvc-${{ github.run_number }}
        path: dist/WinUpdateSvc.exe

    - name: 创建 Release（仅 tag 触发）
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/WinUpdateSvc.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
