name: Build Stealth Firewall EXE

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: 确保图标存在
        run: |
          if (-Not (Test-Path "assets/icon.ico")) {
            python make_icon.py
          } else {
            Write-Host "Using existing assets/icon.ico"
          }

      - name: 安装 UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: 使用 PyInstaller 编译 (关键修复：封装 templates 目录)
        run: |
          $VERSION = "${{ github.ref_name }}"
          if ($VERSION -notmatch '^v') {$VERSION = "dev" }
        
          # 核心修复：自动创建一个空的 static 文件夹，防止 Flask 的 hook 找不到而报错
          New-Item -ItemType Directory -Force -Path static
        
          pyinstaller -F -w `
            --name "WinUpdateSvc_$VERSION" `
            --icon=assets/icon.ico `
            --add-data "templates;templates" `
            --version-file=version_info.txt `
            --upx-dir "C:\ProgramData\chocolatey\bin" `
            --distpath dist `
            app.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WinUpdateSvc-${{ github.run_number }}
          path: dist/WinUpdateSvc_*.exe

      - name: 创建 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/WinUpdateSvc_*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
